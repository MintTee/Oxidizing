name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every node caches its own Minecraft (plus the Forge/NeoForge decompiles): the runner's ~14 GB of free disk isn't enough
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Runs Gradle; toolchains download the JDK each node needs (21 for 1.21.x)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      # A cache saved by a run without the ASM pin (settings.gradle.kts) can hold Minecraft jars with no classes,
      # which Loom reuses instead of rebuilding: drop them so this run regenerates them
      - name: Drop broken cached Minecraft jars
        run: |
          cd ~/.gradle/caches/fabric-loom 2>/dev/null || exit 0
          for jar in */minecraft-merged.jar minecraftMaven/net/minecraft/minecraft-merged-deobf/*/*.jar; do
            [ -f "$jar" ] || continue
            unzip -l "$jar" | grep -q 'net/minecraft/server/MinecraftServer.class' && continue
            v=$(basename "$(dirname "$jar")")
            echo "Removing broken cached Minecraft $v ($jar)"
            rm -rf "$v" minecraftMaven/net/minecraft/*/"$v"
          done

      - run: ./gradlew runGameTest buildAndCollect

      - name: Disk and memory (on failure)
        if: failure()
        run: |
          df -h /
          free -m
          du -sh ~/.gradle ~/.gradle/caches/* 2>/dev/null | sort -h | tail -8

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/
