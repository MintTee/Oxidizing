loomx.loom_version = "1.17-SNAPSHOT"

# One table per Stonecutter node (see settings.gradle.kts)

# Test-only nodes (mod.publish = false) are GameTested against each release a published
# node's range claims, and never published. Ranges split wherever the compiled classes differ:
# at 1.18.2 (FluidTags.WATER became a TagKey), 1.19 (Level.getRandom() returns RandomSource), 1.20.3 (the mixin
# target onRandomTick became changeOverTime: Loom writes the remapped name into the @Inject annotation), and where Java
# changes (17 / 21 / 25). Every node inside a range builds byte-identical classes (checked by comparing javap
# -v output of each node's mod jar: -c misses annotations).

["1.18"]
mod.publish = false
mod.mc_compat = "1.18"
deps.fabric_api = "0.44.0+1.18"

